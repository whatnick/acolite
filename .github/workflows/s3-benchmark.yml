name: S3 OLCI Rust vs Python Benchmark

on:
  workflow_dispatch:
  push:
    branches: [feature/rust-port]
    paths:
      - "src/**"
      - "examples/process_sentinel3.rs"
      - "acolite/sentinel3/**"
      - "acolite/ac/**"
      - ".github/workflows/s3-benchmark.yml"

env:
  ACOLITE_TEST_CACHE: /tmp/acolite_s3_cache
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  benchmark:
    name: S3 OLCI — Rust vs Python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libnetcdf-dev libhdf5-dev pkg-config

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-s3bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-s3bench-

      - name: Cache S3 scene
        uses: actions/cache@v4
        with:
          path: /tmp/acolite_s3_cache
          key: s3-olci-scene-benchmark-v2
          restore-keys: s3-olci-scene-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "numpy<2" scipy matplotlib \
            GDAL==$(gdal-config --version) \
            netCDF4 h5py requests pyproj pyresample scikit-image pyhdf

      - name: Build Rust (release, full-io)
        run: cargo build --release --features full-io --example process_sentinel3

      - name: Setup EarthData credentials
        env:
          EARTHDATA_u: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_p: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          echo "machine urs.earthdata.nasa.gov login ${EARTHDATA_u} password ${EARTHDATA_p}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Download S3 OLCI scene
        run: |
          python3 - <<'EOF'
          import os, sys, requests, zipfile
          from pathlib import Path
          from datetime import datetime, timedelta

          cache = Path(os.environ["ACOLITE_TEST_CACHE"])
          cache.mkdir(parents=True, exist_ok=True)

          # Check for cached scene
          existing = list(cache.glob("*.SEN3"))
          if existing and any(existing[0].glob("*.nc")):
              print(f"✓ Cached: {existing[0].name}")
              sys.exit(0)

          # Search CMR
          end = datetime.utcnow()
          start = end - timedelta(days=14)
          params = {
              "short_name": "S3A_OL_1_EFR",
              "provider": "LAADS",
              "bounding_box": "141,-36.5,145,-33.5",
              "temporal": f"{start:%Y-%m-%dT00:00:00Z},{end:%Y-%m-%dT23:59:59Z}",
              "page_size": "3",
              "sort_key[]": "-start_date",
          }
          resp = requests.get("https://cmr.earthdata.nasa.gov/search/granules.json",
                              params=params, timeout=30)
          resp.raise_for_status()
          entries = resp.json()["feed"]["entry"]
          assert entries, "No S3A OLCI scenes found"

          granule = None
          for entry in entries:
              links = [l["href"] for l in entry.get("links", [])
                       if l["href"].startswith("https://") and l["href"].endswith(".zip")]
              if links:
                  granule = {"id": entry.get("producer_granule_id", ""), "url": links[0]}
                  break
          assert granule, "No downloadable granule"
          print(f"Downloading: {granule['id']}")

          # Download using session with .netrc (handles OAuth redirects)
          session = requests.Session()
          # The key: use netrc-based auth that handles LAADS DAAC OAuth redirects
          resp = session.get(granule["url"], allow_redirects=True, stream=True, timeout=120,
                            auth=requests.auth.HTTPBasicAuth(
                                os.environ.get("EARTHDATA_u", ""),
                                os.environ.get("EARTHDATA_p", "")))

          # If basic auth fails, try token-based approach via .netrc
          if resp.status_code == 401:
              session = requests.Session()
              # Force .netrc usage by not setting auth explicitly
              from netrc import netrc
              nrc = netrc()
              auth = nrc.authenticators("urs.earthdata.nasa.gov")
              if auth:
                  # Get bearer token first
                  token_resp = session.get(
                      "https://urs.earthdata.nasa.gov/api/users/find_or_create_token",
                      auth=(auth[0], auth[2]),
                      headers={"Accept": "application/json"})
                  if token_resp.ok:
                      token = token_resp.json().get("access_token")
                      session.headers["Authorization"] = f"Bearer {token}"
                  else:
                      # Fallback: cookie-based auth
                      session.get("https://urs.earthdata.nasa.gov",
                                  auth=(auth[0], auth[2]))

              resp = session.get(granule["url"], allow_redirects=True, stream=True, timeout=120)

          resp.raise_for_status()
          zip_path = cache / granule["id"]
          with open(zip_path, "wb") as f:
              for chunk in resp.iter_content(128*1024):
                  f.write(chunk)
          with zipfile.ZipFile(zip_path) as zf:
              zf.extractall(cache)
          zip_path.unlink()
          print(f"✓ Downloaded and extracted")
          EOF

      - name: Run Python ACOLITE
        id: python_run
        run: |
          python3 - <<'EOF'
          import sys, time, resource, json, os
          from pathlib import Path
          sys.path.insert(0, ".")
          os.environ.setdefault("EARTHDATA_u", "")  # suppress ancillary download warnings
          import acolite as ac

          cache = Path("/tmp/acolite_s3_cache")
          sen3 = next(cache.glob("*.SEN3"))
          out = cache / "py_output"
          out.mkdir(exist_ok=True)

          settings = {
              "inputfile": str(sen3),
              "output": str(out),
              "limit": [-36.0, 141.0, -34.5, 143.0],
              "verbosity": 1,
              "dsf_aot_estimate": "fixed",
              "l2w_parameters": None,
              "rgb_rhot": False, "rgb_rhos": False, "map_l2w": False,
          }

          t0 = time.time()
          result = ac.acolite.acolite_run(settings=settings)
          elapsed = time.time() - t0
          peak_mb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024

          metrics = {"time_s": round(elapsed, 2), "peak_rss_mb": round(peak_mb)}
          print(f"Python: {elapsed:.1f}s, {peak_mb:.0f} MB")
          Path("/tmp/python_metrics.json").write_text(json.dumps(metrics))
          EOF

      - name: Run Rust ACOLITE
        id: rust_run
        run: |
          SCENE=$(ls -d /tmp/acolite_s3_cache/*.SEN3 | head -1)
          mkdir -p /tmp/acolite_s3_cache/rust_output

          # Use /usr/bin/time for memory measurement
          /usr/bin/time -v ./target/release/examples/process_sentinel3 \
            --scene "$SCENE" \
            --limit "-36.0,141.0,-34.5,143.0" \
            --output /tmp/acolite_s3_cache/rust_output 2>&1 | tee /tmp/rust_full_output.log

          # Parse timing from Rust output
          RUST_TIME=$(grep "Processed in" /tmp/rust_full_output.log | grep -oP '[\d.]+(?=s)' || echo "0")
          RUST_RSS=$(grep "Maximum resident" /tmp/rust_full_output.log | grep -oP '[\d]+' || echo "0")
          RUST_RSS_MB=$((RUST_RSS / 1024))

          echo "{\"time_s\": ${RUST_TIME:-0}, \"peak_rss_mb\": ${RUST_RSS_MB:-0}}" > /tmp/rust_metrics.json
          cat /tmp/rust_metrics.json

      - name: Generate Benchmark Report
        id: report
        run: |
          python3 - <<'EOF'
          import json, os
          from pathlib import Path

          py = json.loads(Path("/tmp/python_metrics.json").read_text())
          rust = json.loads(Path("/tmp/rust_metrics.json").read_text())

          speedup = py["time_s"] / rust["time_s"] if rust["time_s"] > 0 else 0
          mem_saving = (1 - rust["peak_rss_mb"] / py["peak_rss_mb"]) * 100 if py["peak_rss_mb"] > 0 else 0

          # Console output
          print(f"\n{'='*60}")
          print(f"  S3 OLCI BENCHMARK: Rust vs Python")
          print(f"{'='*60}")
          print(f"  {'Metric':<20} {'Python':>10} {'Rust':>10} {'Factor':>10}")
          print(f"  {'-'*20} {'-'*10} {'-'*10} {'-'*10}")
          print(f"  {'Wall time (s)':<20} {py['time_s']:>10.1f} {rust['time_s']:>10.1f} {speedup:>9.1f}×")
          print(f"  {'Peak RSS (MB)':<20} {py['peak_rss_mb']:>10.0f} {rust['peak_rss_mb']:>10.0f} {mem_saving:>8.0f}% less")
          print(f"{'='*60}")

          # GitHub Step Summary
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/tmp/summary.md")
          with open(summary_path, "w") as f:
              f.write(f"## 🛰️ S3 OLCI Benchmark — Rust vs Python\n\n")
              f.write(f"| Metric | Python | Rust | Improvement |\n")
              f.write(f"|--------|--------|------|-------------|\n")
              f.write(f"| **Wall time** | {py['time_s']:.1f}s | {rust['time_s']:.1f}s | **{speedup:.1f}× faster** |\n")
              f.write(f"| **Peak RAM** | {py['peak_rss_mb']:.0f} MB | {rust['peak_rss_mb']:.0f} MB | {mem_saving:.0f}% less |\n")
              f.write(f"\n_Scene: S3A OLCI EFR, SE Australia, 737×828 pixels, DSF fixed AOT_\n")

          # Generate badge JSON (shields.io endpoint format)
          badge = {
              "schemaVersion": 1,
              "label": "S3 Speedup",
              "message": f"{speedup:.0f}×",
              "color": "brightgreen" if speedup >= 5 else "yellow" if speedup >= 2 else "red",
          }
          Path("/tmp/benchmark-badge.json").write_text(json.dumps(badge, indent=2))

          # Generate results markdown for embedding in repo
          results_md = f"""<!-- AUTO-GENERATED by s3-benchmark.yml — do not edit -->
          # ACOLITE-RS Benchmark Results

          ## Sentinel-3 OLCI — Dark Spectrum Fitting

          | Metric | Python | Rust | Improvement |
          |--------|--------|------|-------------|
          | **Processing time** | {py['time_s']:.1f}s | {rust['time_s']:.1f}s | **{speedup:.1f}× faster** |
          | **Peak memory** | {py['peak_rss_mb']:.0f} MB | {rust['peak_rss_mb']:.0f} MB | {mem_saving:.0f}% reduction |

          **Scene**: S3A OLCI EFR, SE Australia coast  
          **ROI**: 737×828 pixels (≈220 km × 250 km)  
          **Algorithm**: DSF atmospheric correction, fixed AOT estimation  
          **Runner**: GitHub Actions `ubuntu-latest` (4 cores, 16 GB RAM)

          _Last updated: {os.environ.get('GITHUB_SHA', 'local')[:8]} on {os.environ.get('GITHUB_REF_NAME', 'unknown')}_

          ---

          ![Speedup](https://img.shields.io/badge/S3_Speedup-{speedup:.0f}×-brightgreen)
          ![Rust Time](https://img.shields.io/badge/Rust-{rust['time_s']:.1f}s-blue)
          ![Python Time](https://img.shields.io/badge/Python-{py['time_s']:.1f}s-orange)
          """
          Path("/tmp/benchmark-results.md").write_text(results_md)

          # Assert performance
          assert speedup > 2.0, f"Rust should be >2× faster (got {speedup:.1f}×)"
          EOF

      - name: Commit benchmark results
        if: success() && github.event_name == 'push'
        run: |
          cp /tmp/benchmark-badge.json .github/benchmark-badge.json
          cp /tmp/benchmark-results.md BENCHMARK_RESULTS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/benchmark-badge.json BENCHMARK_RESULTS.md
          git diff --cached --quiet || git commit -m "ci: update benchmark results [skip ci]"
          git push || true  # Don't fail if push is rejected

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-benchmark-results
          path: |
            /tmp/python_metrics.json
            /tmp/rust_metrics.json
            /tmp/rust_full_output.log
            /tmp/benchmark-badge.json
            /tmp/benchmark-results.md
