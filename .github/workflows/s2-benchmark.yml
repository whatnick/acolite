name: Sentinel-2 Rust vs Python Benchmark

on:
  workflow_dispatch:
  push:
    branches: [feature/rust-port]
    paths:
      - "src/loader/sentinel2.rs"
      - "examples/process_sentinel2_ac.rs"
      - "acolite/sentinel2/**"
      - ".github/workflows/s2-benchmark.yml"

env:
  ACOLITE_TEST_CACHE: /tmp/acolite_s2_cache
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  benchmark:
    name: Sentinel-2 — Rust vs Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libnetcdf-dev libhdf5-dev pkg-config

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-s2bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-s2bench-

      - name: Cache S2 scene
        uses: actions/cache@v5
        with:
          path: /tmp/acolite_s2_cache
          key: s2-l1c-element84-v1-${{ github.sha }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "numpy<2"
          pip install --no-build-isolation GDAL==$(gdal-config --version)
          pip install scipy matplotlib \
            netCDF4 h5py requests pyproj pyresample scikit-image pyhdf

      - name: Build Rust (release, full-io + gdal)
        run: cargo build --release --features "full-io,gdal-support" --example process_sentinel2_ac

      - name: Download S2 L1C scene from ESA CDSE
        env:
          CDSE_u: ${{ secrets.CDSE_USERNAME }}
          CDSE_p: ${{ secrets.CDSE_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, sys, requests, zipfile
          from pathlib import Path

          cache = Path(os.environ["ACOLITE_TEST_CACHE"])
          cache.mkdir(parents=True, exist_ok=True)

          # Check cache
          existing = list(cache.glob("S2*_MSIL1C_*.SAFE"))
          if existing and (existing[0] / "MTD_MSIL1C.xml").exists():
              print(f"Cached: {existing[0].name}")
              sys.exit(0)

          # Get CDSE token
          u = os.environ.get("CDSE_u", "")
          p = os.environ.get("CDSE_p", "")
          token_resp = requests.post(
              "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token",
              data={"grant_type": "password", "username": u, "password": p, "client_id": "cdse-public"},
              timeout=30)
          assert token_resp.ok, f"CDSE token failed: {token_resp.status_code}"
          token = token_resp.json()["access_token"]

          # Search for a small S2 L1C scene over SE Australia
          search_url = "https://catalogue.dataspace.copernicus.eu/odata/v1/Products"
          params = {
              "$filter": "Collection/Name eq 'SENTINEL-2' and Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productType' and att/OData.CSC.StringAttribute/Value eq 'S2MSI1C') and contains(Name,'T54HWF') and ContentDate/Start ge 2024-01-01T00:00:00.000Z and ContentDate/Start le 2024-02-28T23:59:59.000Z",
              "$top": 5,
              "$orderby": "ContentDate/Start desc",
          }
          resp = requests.get(search_url, params=params, timeout=30)
          resp.raise_for_status()
          products = resp.json()["value"]
          assert products, "No S2 products found"

          # Pick smallest scene
          product = products[0]
          product_id = product["Id"]
          product_name = product["Name"]
          size_mb = product.get("ContentLength", 0) // 1024 // 1024
          print(f"Selected: {product_name} ({size_mb} MB)")

          # Download
          session = requests.Session()
          session.headers["Authorization"] = f"Bearer {token}"
          url = f"https://zipper.dataspace.copernicus.eu/odata/v1/Products({product_id})/$value"
          print("Downloading...")
          resp = session.get(url, stream=True, timeout=300)
          resp.raise_for_status()

          zip_path = cache / "scene.zip"
          downloaded = 0
          with open(zip_path, "wb") as f:
              for chunk in resp.iter_content(128*1024):
                  f.write(chunk)
                  downloaded += len(chunk)
          print(f"Downloaded: {downloaded // 1024 // 1024} MB")

          # Extract
          with zipfile.ZipFile(zip_path) as zf:
              zf.extractall(cache)
          zip_path.unlink()

          safe_dirs = list(cache.glob("S2*_MSIL1C_*.SAFE"))
          assert safe_dirs, "No SAFE directory after extraction"
          print(f"Extracted: {safe_dirs[0].name}")
          EOF

      - name: Run Python ACOLITE
        run: |
          python3 - <<'EOF'
          import sys, time, resource, json, os
          from pathlib import Path
          sys.path.insert(0, ".")
          import acolite as ac

          cache = Path("/tmp/acolite_s2_cache")
          safe_dir = next(cache.glob("S2*.SAFE"))
          out = cache / "py_output"
          out.mkdir(exist_ok=True)

          settings = {
              "inputfile": str(safe_dir),
              "output": str(out),
              
              "verbosity": 1,
              "s2_target_res": 20,
              "dsf_aot_estimate": "fixed",
              "l2w_parameters": None,
              "rgb_rhot": False, "rgb_rhos": False, "map_l2w": False,
          }

          t0 = time.time()
          result = ac.acolite.acolite_run(settings=settings)
          elapsed = time.time() - t0
          peak_mb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024

          metrics = {"time_s": round(elapsed, 2), "peak_rss_mb": round(peak_mb)}
          print(f"Python: {elapsed:.1f}s, {peak_mb:.0f} MB")
          Path("/tmp/python_s2_metrics.json").write_text(json.dumps(metrics))
          EOF

      - name: Run Rust ACOLITE
        continue-on-error: true
        run: |
          SCENE=$(ls -d /tmp/acolite_s2_cache/S2*.SAFE | head -1)
          mkdir -p /tmp/acolite_s2_cache/rust_output

          /usr/bin/time -v ./target/release/examples/process_sentinel2_ac \
            --file "$SCENE" \
             \
            --res 20 \
            --output /tmp/acolite_s2_cache/rust_output \
            --aot-mode fixed 2>&1 | tee /tmp/rust_s2_output.log

          RUST_TOTAL=$(grep "Total:" /tmp/rust_s2_output.log | grep -oP '[\d.]+(?=s)' | tail -1 || echo "0")
          RUST_RSS=$(grep "Maximum resident" /tmp/rust_s2_output.log | grep -oP '[\d]+' || echo "0")
          RUST_RSS_MB=$((RUST_RSS / 1024))

          if [ ! -f /tmp/rust_s2_output.log ]; then
            RUST_TOTAL="0"
            RUST_RSS_MB="0"
          fi

          echo "{\"time_s\": ${RUST_TOTAL:-0}, \"peak_rss_mb\": ${RUST_RSS_MB:-0}}" > /tmp/rust_s2_metrics.json
          cat /tmp/rust_s2_metrics.json

      - name: Generate Benchmark Report
        run: |
          python3 - <<'EOF'
          import json, os
          from pathlib import Path

          py = json.loads(Path("/tmp/python_s2_metrics.json").read_text())
          rust_file = Path("/tmp/rust_s2_metrics.json")
          rust = json.loads(rust_file.read_text()) if rust_file.exists() else {"time_s": 0, "peak_rss_mb": 0}

          speedup = py["time_s"] / rust["time_s"] if rust["time_s"] > 0 else 0

          print(f"\n{'='*60}")
          print(f"  SENTINEL-2 BENCHMARK: Rust vs Python")
          print(f"{'='*60}")
          print(f"  {'Metric':<20} {'Python':>10} {'Rust':>10} {'Factor':>10}")
          print(f"  {'-'*20} {'-'*10} {'-'*10} {'-'*10}")
          print(f"  {'Wall time (s)':<20} {py['time_s']:>10.1f} {rust['time_s']:>10.1f} {speedup:>9.1f}×")
          if rust["peak_rss_mb"] > 0:
              print(f"  {'Peak RSS (MB)':<20} {py['peak_rss_mb']:>10.0f} {rust['peak_rss_mb']:>10.0f}")
          print(f"{'='*60}")

          # GitHub Step Summary
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/tmp/summary.md")
          with open(summary_path, "w") as f:
              f.write(f"## 🛰️ Sentinel-2 Benchmark — Rust vs Python\n\n")
              f.write(f"| Metric | Python | Rust | Improvement |\n")
              f.write(f"|--------|--------|------|-------------|\n")
              f.write(f"| **Wall time** | {py['time_s']:.1f}s | {rust['time_s']:.1f}s | **{speedup:.1f}× faster** |\n")
              if rust["peak_rss_mb"] > 0:
                  f.write(f"| **Peak RAM** | {py['peak_rss_mb']:.0f} MB | {rust['peak_rss_mb']:.0f} MB |\n")

          if rust["time_s"] > 0:
              assert speedup > 2.0, f"Rust should be >2× faster (got {speedup:.1f}×)"
          else:
              print("⚠️  Rust processing failed — benchmark incomplete")
          EOF

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: s2-benchmark-results
          path: |
            /tmp/python_s2_metrics.json
            /tmp/rust_s2_metrics.json
            /tmp/rust_s2_output.log
